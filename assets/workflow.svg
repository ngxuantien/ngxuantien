<line x1="100" y1="64" x2="100" y2="64" stroke="url(#prog)" stroke-width="2.5" stroke-linecap="round"><animate attributeName="x2" dur="8s" repeatCount="indefinite" keyTimes="0;.75;.95;1" values="100;900;900;100"/></line>
<g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" text-anchor="middle">
