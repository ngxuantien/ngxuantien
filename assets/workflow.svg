<text x="500" y="68" fill="#8B949E"><animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.375;.95" values="#8B949E;#FFFFFF;#8B949E"/>03</text>
<circle cx="700" cy="64" r="15" fill="#161B22" stroke="#30363D" stroke-width="1.5"><animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.5625;.95" values="#161B22;#DE4785;#161B22"/></circle>
<text x="700" y="68" fill="#8B949E"><animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.5625;.95" values="#8B949E;#FFFFFF;#8B949E"/>04</text>
<circle cx="900" cy="64" r="15" fill="#161B22" stroke="#30363D" stroke-width="1.5"><animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.75;.95" values="#161B22;#FF3D5A;#161B22"/></circle>
<text x="900" y="68" fill="#8B949E"><animate attributeName="fill" dur="8s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;.75;.95" values="#8B949E;#FFFFFF;#8B949E"/>05</text>
<circle cx="900" cy="64" r="15" fill="none" stroke="#FF3D5A" stroke-width="1.5" opacity="0"><animate attributeName="r" dur="8s" repeatCount="indefinite" keyTimes="0;.75;.9;1" values="15;15;30;30"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;.75;.7501;.9;1" values="0;0;.8;0;0"/></circle>
