<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="100%" role="img" aria-labelledby="wf-title wf-desc">
<title id="wf-title">How I like to work</title>
<desc id="wf-desc">Understand the user problem, design a simple architecture, build small testable features, review and document, ship with confidence.</desc>
<defs>
